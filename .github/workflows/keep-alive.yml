name: Keep Vercel Backend Awake

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch: # Allows manual triggering from GitHub actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Pinging Vercel Backend to prevent cold starts..."
          curl -I -f https://backend-rouge-eight-92.vercel.app/health || echo "Ping failed, but workflow continues."
