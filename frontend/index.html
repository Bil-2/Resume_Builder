<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Resume Builder & Career Ecosystem - Build professional resumes automatically from your achievements" />
    <meta http-equiv="Cross-Origin-Opener-Policy" content="unsafe-none" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />
    <script>
      // Suppress harmless Cross-Origin-Opener-Policy warnings from Google OAuth
      (function() {
        const originalError = console.error;
        
        console.error = function(...args) {
          // Check if this is a COOP warning about window.closed
          const message = args[0];
          if (typeof message === 'string' && 
              message.includes('Cross-Origin-Opener-Policy') && 
              message.includes('window.closed')) {
            // Suppress this specific warning - it's harmless
            return;
          }
          // Pass through all other errors
          originalError.apply(console, args);
        };
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <title>Resume Builder & Career Ecosystem</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
